[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostline-game-scout"
version = "0.1.0"
description = "Standalone Cyberpunk 2077 scouting MCP server"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[project.scripts]
game-scout = "game_scout.cli:main"

[project.optional-dependencies]
test = ["numpy>=2,<3"]

[tool.setuptools]
packages = ["game_scout"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.package-data]
game_scout = ["cet/*.lua"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["F"]
